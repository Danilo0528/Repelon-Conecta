# Despliegue del backend Spring Boot en Render.
# Uso: desde la raiz del repo -> New > Blueprint > apuntar a este repo.
#
# NO subas los valores reales de las variables sync: false. Se piden en el
# panel de Render la primera vez y quedan guardadas ahi.

services:
  - type: web
    name: replonconecta-api
    # Render no acepta runtime "java" en blueprints (valores validos: node,
    # python, ruby, go, elixir, rust, docker, image, static). Se usa Docker
    # con un Dockerfile multi-stage: Maven 3.9 + JDK 17 compilan, y una JRE
    # minima corre el jar. El CMD del Dockerfile manda; PORT lo inyecta
    # Render y la app lo lee en application.properties.
    runtime: docker
    plan: free
    region: oregon
    # SIN rootDir: con runtime docker, Render une rootDir + dockerContext y
    # la ruta se triplicaba (error "lstat .../ReplonConecta/ReplonConecta/
    # ReplonConecta: no such file"). dockerfilePath/dockerContext van
    # relativos a la raiz del repo y listo. buildFilter conserva el efecto
    # de rootDir: solo los cambios del backend disparan el build.
    dockerfilePath: ./ReplonConecta/ReplonConecta/Dockerfile
    dockerContext: ./ReplonConecta/ReplonConecta
    buildFilter:
      paths:
        - ReplonConecta/ReplonConecta/**
        - render.yaml
    healthCheckPath: /actuator/health

    # Render inyecta estas variables desde el panel. Se dejan marked
    # sync:false para que el valor real nunca viva en este archivo.
    # (El puerto NO va aqui: Render lo inyecta en PORT y la app lo lee.)
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # update = Hibernate crea/actualiza las tablas al arrancar.
      # Poner en "none" cuando haya migraciones(Flyway/Liquibase).
      - key: DDL_AUTO
        value: update
      - key: AUTO_APPROVE
        value: "true"
      # true solo para la primera arrancada (base nueva vacia); despues
      # cambiar a false. La siembra es idempotente: si ya hay categorias
      # se omite sola.
      - key: SEED
        value: "true"