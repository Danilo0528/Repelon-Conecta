name: docs-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si llegan dos pushes seguidos, cancela el run viejo: el nuevo ya incluye
# el estado mas reciente del repositorio.
concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Documentación viva y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ReplonConecta/frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Instalar dependencias de la raíz
        run: npm ci

      - name: Instalar dependencias del frontend
        run: npm ci --prefix ReplonConecta/frontend

      - name: Verificar documentación viva
        run: npm run docs:check

      - name: Typecheck del frontend
        run: npm run typecheck

      - name: Tests del frontend
        run: npm test

      - name: Tests del backend
        run: mvn -B -f ReplonConecta/ReplonConecta/pom.xml test
