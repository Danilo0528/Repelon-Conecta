name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si llegan dos pushes seguidos, cancela el run viejo: el nuevo ya incluye
# el estado mas reciente del repositorio.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TDD: los tests son el primer gate. Corren en su propio job para que un
  # fallo de documentacion no los deje en "skipped".
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ReplonConecta/frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Unica fuente de verdad del JDK. Ver docs/README.md.
          java-version-file: .java-version
          cache: maven

      - name: Instalar dependencias de la raiz
        run: npm ci

      - name: Instalar dependencias del frontend
        run: npm ci --prefix ReplonConecta/frontend

      - name: Typecheck del frontend
        run: npm run typecheck

      - name: Tests del frontend
        run: npm test

      - name: Tests del backend
        run: mvn -B -f ReplonConecta/ReplonConecta/pom.xml test

  docs:
    name: Documentación viva
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ReplonConecta/frontend/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # El doclet de Javadoc cambia entre vendors y parches; generar con
          # este mismo build mantiene docs/generated reproducible. Ver
          # docs/README.md.
          java-version-file: .java-version
          cache: maven

      - name: Instalar dependencias de la raiz
        run: npm ci

      - name: Instalar dependencias del frontend
        run: npm ci --prefix ReplonConecta/frontend

      - name: Verificar documentacion viva
        run: npm run docs:check
