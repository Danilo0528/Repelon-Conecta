# ==========================================================================
# Perfil "test" - SOLO para tests
# --------------------------------------------------------------------------
# A diferencia de un application.properties en src/test/resources (que
# sombrea por completo el de produccion), este archivo es un perfil: se
# carga ENCIMA del application.properties real. Asi los tests validan
# tambien los nombres y valores de la configuracion de produccion, y solo
# se pisa lo imprescindible para no depender de Postgres ni de Supabase.
#
# Se activa con @ActiveProfiles("test") en las clases de test.
# ==========================================================================

# H2 en memoria, en modo PostgreSQL para que las diferencias de dialecto
# no oculten errores que si aparecerian contra la base real.
spring.datasource.url=jdbc:h2:mem:replontest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Esquema limpio en cada corrida; en produccion el default sigue siendo update.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Secreto de mentira: el decoder solo exige que no venga vacio. Los tests
# no validan tokens reales, solo que el contexto arranque.
supabase.jwt-secret=secreto-solo-para-tests-no-usar-en-produccion

# El seed se prueba a proposito: si el codigo de siembra esta roto, el
# contexto falla y el build lo detecta.
app.seed.activo=true