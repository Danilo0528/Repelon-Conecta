spring.application.name=RepelonConecta

# ==========================================================================
# SERVIDOR
# ==========================================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# ==========================================================================
# BASE DE DATOS - Supabase Postgres
# --------------------------------------------------------------------------
# Copia esta linea desde Supabase > Project Settings > Database > Connection
# string > JDBC (o arma la URL a mano con el host que te dio Supabase).
#
# OJO con dos cosas:
#  1. Supabase exige SSL: va siempre ?sslmode=require
#  2. La clave va URL-encoded. Si tu clave tiene @ : / o +, hay que
#     escapearla (%40 %3A %2F %2B) o la conexion falla.
# ==========================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/replonconecta}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Danilo0528}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ==========================================================================
# JPA / Hibernate - Spring Boot es el dueno del esquema
# --------------------------------------------------------------------------
# update = Hibernate crea/actualiza las tablas al arrancar. No se usa el
# cliente web de Supabase para tocar el esquema.
# ==========================================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ==========================================================================
# SUPABASE - Autenticacion (correo + clave)
# --------------------------------------------------------------------------
# El JWT secret esta en Supabase > Project Settings > API > JWT Secret.
# Este valor NUNCA debe subirse a git. Va por variable de entorno.
# ==========================================================================
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# Proyectos nuevos con "JWT signing keys" (ECC/RSA) no tienen secreto: se
# valida contra el JWKS. Si se deja vacio, se arma solo a partir de
# supabase.url -> {SUPABASE_URL}/auth/v1/.well-known/jwks.json
supabase.jwks-uri=${SUPABASE_JWKS_URI:}
supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:}
supabase.url=${SUPABASE_URL:https://tuproyecto.supabase.co}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:productos}

# Origenes permitidos por CORS (frontend Next.js). Separados por coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ==========================================================================
# REGLAS DE NEGOCIO
# ==========================================================================
app.negocio.nombre=Repelon Market
app.negocio.moneda=COP
app.negocio.zona-horaria=America/Bogota
#_AUTO_APPROVE=true -> el negocio queda aprobado al registrarse (MVP).
# Poner en false para activar el flujo pendiente de aprobacion del admin.
app.negocio.auto-aprueba=${AUTO_APPROVE:true}

# ==========================================================================
# SEMILLA DE DATOS (seed)
# --------------------------------------------------------------------------
# Crea las 3 categorias del alcance (agro, pesca, turismo) y 2 negocios
# ficticios de Repelon (agro y pesca) la primera vez que arranca contra
# una base vacia. Poner en false para no volver a sembrar.
# ==========================================================================
app.seed.activo=${SEED:false}

# ==========================================================================
# LOGGING
# ==========================================================================
logging.level.com.repelonconecta=INFO